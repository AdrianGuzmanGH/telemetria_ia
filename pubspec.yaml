name: telemetria_ia
description: Demo de telemetría GPS + IA on-device con Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  flutter_map_vector_tiles: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true